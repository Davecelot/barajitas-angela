name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check (secret scan + ignore hygiene)
        run: npm run security:check

      - name: Dependency audit
        run: npm run security:deps

      - name: Tests
        run: npm test --silent

      - name: Validate album data
        run: npm run validate:album-data

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repo variable is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          npm run build

      - name: Scan dist for leaked secrets
        run: |
          if grep -rIE "(barajitas2026|album2026|password_hash|pbkdf2\\\$|JWT_SECRET)" dist/; then
            echo "::error::Sensitive token found in built bundle. Refusing to deploy."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
